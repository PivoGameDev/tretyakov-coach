<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель — Заявки</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Montserrat', Arial, sans-serif; background: #1a1423; color: #E5E5E5; padding: 40px 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { font-size: 28px; margin-bottom: 24px; color: #D0336C; }
    .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .card-name { font-size: 18px; font-weight: 700; }
    .card-date { font-size: 13px; opacity: 0.5; }
    .card-row { display: flex; gap: 8px; margin-bottom: 6px; font-size: 14px; }
    .card-label { opacity: 0.5; min-width: 80px; }
    .card-value { opacity: 0.9; }
    .empty { text-align: center; padding: 60px 20px; opacity: 0.5; }
    .empty h2 { font-size: 20px; margin-bottom: 8px; }
    .loading { text-align: center; padding: 60px; opacity: 0.6; }
    .error { text-align: center; padding: 60px; color: #D0336C; }
    .refresh { display: inline-block; padding: 10px 24px; background: #D0336C; color: #fff; border: none; border-radius: 25px; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 20px; transition: background .3s; }
    .refresh:hover { background: #b82c5e; }
    .stats { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 16px 24px; flex: 1; min-width: 120px; text-align: center; }
    .stat-num { font-size: 28px; font-weight: 700; color: #D0336C; }
    .stat-label { font-size: 12px; opacity: 0.5; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📋 Заявки с сайта</h1>
    <div id="app"></div>
  </div>
  <script>
    const tgToken = atob('ODg4MDMzNDAzNTpBQUhTZ0I4Z0NMTVM3OUJ3aEluOFpzU01RU0ZtWFpFTE1WWQ==');
    const chatId = '1163907662';

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function parseApp(text) {
      const lines = text.split('\n');
      let name = '', phone = '', email = '', message = '';
      lines.forEach(line => {
        if (line.startsWith('Имя:')) name = line.replace('Имя:', '').trim();
        if (line.startsWith('Телефон:')) phone = line.replace('Телефон:', '').trim();
        if (line.startsWith('Email:')) email = line.replace('Email:', '').trim();
        if (line.startsWith('Сообщение:')) message = line.replace('Сообщение:', '').trim();
      });
      return { name, phone, email, message };
    }

    function formatDate(ts) {
      const d = new Date(ts * 1000);
      return d.toLocaleString('ru-RU');
    }

    async function load() {
      const app = document.getElementById('app');
      app.innerHTML = '<div class="loading">Загрузка заявок...</div>';
      try {
        const res = await fetch(`https://api.telegram.org/bot${tgToken}/getUpdates`);
        const data = await res.json();
        if (!data.ok) throw new Error(data.description);
        const apps = data.result.filter(u => u.message && u.message.chat && String(u.message.chat.id) === chatId && u.message.text && !u.message.text.startsWith('/'));
        if (!apps.length) {
          app.innerHTML = '<div class="empty"><h2>Пока нет заявок</h2><p>Когда кто-то оставит заявку, она появится здесь.</p></div>';
          return;
        }
        let html = `<div class="stats"><div class="stat"><div class="stat-num">${apps.length}</div><div class="stat-label">Всего заявок</div></div></div>`;
        html += `<button class="refresh" onclick="load()">🔄 Обновить</button>`;
        apps.reverse().forEach(u => {
          const p = parseApp(u.message.text);
          html += `<div class="card">
            <div class="card-header">
              <div class="card-name">${escapeHtml(p.name || 'Без имени')}</div>
              <div class="card-date">${formatDate(u.message.date)}</div>
            </div>
            <div class="card-row"><span class="card-label">Телефон</span><span class="card-value">${escapeHtml(p.phone)}</span></div>
            <div class="card-row"><span class="card-label">Email</span><span class="card-value">${escapeHtml(p.email)}</span></div>
            ${p.message && p.message !== '—' ? `<div class="card-row"><span class="card-label">Сообщение</span><span class="card-value">${escapeHtml(p.message)}</span></div>` : ''}
          </div>`;
        });
        app.innerHTML = html;
      } catch(e) {
        app.innerHTML = `<div class="error">Ошибка загрузки: ${escapeHtml(e.message)}</div>`;
      }
    }
    load();
  </script>
</body>
</html>
