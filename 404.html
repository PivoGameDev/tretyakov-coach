<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Страница не найдена</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Unbounded:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Montserrat', Arial, sans-serif; background: #1a1423; color: #E5E5E5; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 20px; }
    .wrap { max-width: 500px; }
    h1 { font-family: 'Unbounded', sans-serif; font-size: 80px; color: #D0336C; margin-bottom: 10px; }
    h2 { font-size: 22px; margin-bottom: 16px; font-weight: 600; }
    p { font-size: 15px; opacity: 0.8; margin-bottom: 30px; line-height: 1.6; }
    .btn { display: inline-block; padding: 12px 32px; background: #D0336C; color: #fff; text-decoration: none; border-radius: 25px; font-weight: 600; transition: background 0.3s; }
    .btn:hover { background: #b82c5e; }
    .langs { margin-top: 20px; font-size: 13px; opacity: 0.6; }
    .langs a { color: #E5E5E5; margin: 0 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>404</h1>
    <h2>Страница не найдена</h2>
    <p>Возможно, страница была удалена или ссылка неверна. Вернитесь на главную, чтобы продолжить.</p>
    <a href="index.html" class="btn">На главную</a>
  </div>
</body>
</html>
